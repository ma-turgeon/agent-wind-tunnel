<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Authority boundary in Agent Wind Tunnel</title>
  <desc id="desc">Untrusted blueprint and model requests pass through trusted static validation and an immutable policy broker. Ordinary capabilities can only be confirmed inside initial grants, while a consequential simulated effect needs a run- and artifact-bound approval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1420"/>
      <stop offset="1" stop-color="#1a2f42"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8aa9c1"/>
    </marker>
    <style>
      .title { font-family: "DejaVu Sans"; font-size: 34px; font-weight: 700; fill: #f7fbff; }
      .subtitle { font-family: "DejaVu Sans"; font-size: 17px; font-weight: 400; fill: #b8c8d9; }
      .zone-untrusted { fill: #351f2c; stroke: #e08aa8; stroke-width: 2; }
      .zone-trusted { fill: #14352f; stroke: #69d6a3; stroke-width: 2; }
      .zone-effect { fill: #3d2d1e; stroke: #f0b56b; stroke-width: 2; }
      .heading { font-family: "DejaVu Sans"; font-size: 21px; font-weight: 700; fill: #f7fbff; text-anchor: middle; }
      .copy { font-family: "DejaVu Sans"; font-size: 14px; font-weight: 400; fill: #d1dce7; text-anchor: middle; }
      .tag { font-family: "DejaVu Sans"; font-size: 12px; font-weight: 700; text-anchor: middle; letter-spacing: 1px; }
      .line { stroke: #8aa9c1; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .deny { font-family: "DejaVu Sans"; font-size: 14px; font-weight: 700; fill: #f1a4bc; text-anchor: middle; }
      .ok { font-family: "DejaVu Sans"; font-size: 14px; font-weight: 700; fill: #9ee7bd; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1400" height="560" rx="28" fill="url(#bg)"/>
  <text x="60" y="65" class="title">The graph requests authority; it does not own policy</text>
  <text x="60" y="99" class="subtitle">Structural checks and a frozen envelope mediate every capability before the data-only effect simulator.</text>

  <rect x="55" y="155" width="300" height="285" rx="22" class="zone-untrusted"/>
  <text x="205" y="191" class="tag" fill="#f2a9c1">UNTRUSTED / FALLIBLE</text>
  <text x="205" y="230" class="heading">Blueprint + model</text>
  <text x="205" y="270" class="copy">Declared node request</text>
  <text x="205" y="298" class="copy">Model-generated artifact</text>
  <text x="205" y="326" class="copy">Emitted route outcome</text>
  <text x="205" y="372" class="deny">Cannot add grants</text>
  <text x="205" y="398" class="deny">Cannot mint approval</text>

  <path d="M355 295 H445" class="line"/>

  <rect x="450" y="130" width="500" height="335" rx="22" class="zone-trusted"/>
  <text x="700" y="169" class="tag" fill="#9ee7bd">TRUSTED COMPUTING BASE</text>
  <text x="700" y="208" class="heading">Validator + authority broker</text>
  <rect x="495" y="242" width="190" height="145" rx="16" fill="#0e2b28" stroke="#69d6a3"/>
  <text x="590" y="276" class="heading" font-size="17">Static path checks</text>
  <text x="590" y="310" class="copy">Capability catalog</text>
  <text x="590" y="335" class="copy">Scope + node binding</text>
  <text x="590" y="360" class="copy">Approval dominance</text>
  <rect x="715" y="242" width="190" height="145" rx="16" fill="#0e2b28" stroke="#69d6a3"/>
  <text x="810" y="276" class="heading" font-size="17">Runtime broker</text>
  <text x="810" y="310" class="copy">Frozen initial grants</text>
  <text x="810" y="335" class="copy">Bound approval hash</text>
  <text x="810" y="360" class="copy">Idempotency memo</text>
  <text x="700" y="425" class="ok">grant within envelope · approve exact binding · otherwise escalate</text>

  <path d="M950 295 H1040" class="line"/>

  <rect x="1045" y="155" width="300" height="285" rx="22" class="zone-effect"/>
  <text x="1195" y="191" class="tag" fill="#ffd19a">CONSEQUENTIAL BOUNDARY</text>
  <text x="1195" y="230" class="heading">Built-in simulator</text>
  <text x="1195" y="273" class="copy">Exact run + artifact</text>
  <text x="1195" y="301" class="copy">Exact capability + scope</text>
  <text x="1195" y="329" class="copy">One-time execution</text>
  <text x="1195" y="374" class="ok" fill="#ffd19a">simulation only</text>
  <text x="1195" y="400" class="deny">no external deployment</text>

  <text x="700" y="516" class="subtitle" text-anchor="middle">Architecture demonstration only: production still needs IAM, sandboxing, authenticated approval, durable audit, and reconciliation.</text>
</svg>
